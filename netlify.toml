# Netlify faqat FRONTEND'ni (Vite build) joylaydi. Express/Telegram backend alohida hostingda (README → "Backend").
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # MUHIM: Netlify'da VITE_API_BASE ni backend manziliga qo'ying (Site settings → Environment variables).

# SPA: /s/<ID>, /demo/<shablon>, /shablonlar ... to'g'ridan-to'g'ri ochilganda index.html qaytsin.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
